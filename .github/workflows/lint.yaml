name: Call Linter

on:
  workflow_call:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
  lint:
    name: Run linter, formatter, and type checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting and run linter
        run: npx biome ci

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
