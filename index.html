<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="%BASE_URL%favicon.ico" rel="icon" sizes="32x32" />
    <link href="%BASE_URL%icon.svg" rel="icon" type="image/svg+xml" />
    <!-- Pinch zoom stays available. Inputs use 16px text or larger, so iOS
         does not zoom in when one is focused. -->
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="Vert" name="apple-mobile-web-app-title" />
    <!-- "default" lets iOS draw dark status bar text over the pale header in
         light mode and light text in dark mode. -->
    <meta content="default" name="apple-mobile-web-app-status-bar-style" />
    <meta
      content="#edf7f2"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    />
    <meta
      content="#05130c"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    />
    <link href="%BASE_URL%apple-touch-icon.png" rel="apple-touch-icon" />
    <link href="%BASE_URL%manifest.webmanifest" rel="manifest" />

    <title>Vert - Currency Converter</title>
    <!-- Paints the right background before the stylesheet arrives. -->
    <style>
      html {
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #000000;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
